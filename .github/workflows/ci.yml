name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel any in-flight run for the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- 1. secret scanning ----
  secrets:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- 2. preflight (dev rules) — fast, runs first ----
  preflight-dev:
    name: preflight (dev rules)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./.ci_recovery.db
      API_KEYS: ci-admin-key-1234567890ab:admin,ci-run-key-1234567890ab:run,read,ci-read-key-1234567890ab:read
      LLM_PROVIDER: mock
      ENVIRONMENT: dev
      EMAIL_PROVIDER: console
      PAYMENT_PROVIDER: console
      ALLOW_MOCK_ADAPTERS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Preflight must pass for dev env
        run: python -m scripts.preflight --env dev

  # ---- 3. preflight (prod rules) — catches the deploy-time misconfigs ----
  preflight-prod:
    name: preflight (prod rules)
    runs-on: ubuntu-latest
    # Use a known-good prod-shaped config; the point is to PROVE the prod
    # rules don't reject a valid setup, and that they DO reject a misconfig.
    env:
      DATABASE_URL: postgresql+psycopg2://recovery:recovery@db.internal:5432/recovery
      API_KEYS: ci-admin-key-1234567890ab:admin,ci-run-key-1234567890ab:run,read,ci-read-key-1234567890ab:read
      LLM_PROVIDER: openrouter
      OPENROUTER_API_KEY: sk-or-ci-fake
      MODEL_FRONTIER: minimax/minimax-m3:free
      MODEL_SMALL: minimax/minimax-m3:free
      ENVIRONMENT: prod
      EMAIL_PROVIDER: mailgun
      EMAIL_FROM: recovery@example.com
      MAILGUN_API_KEY: key-ci-1234567890abcdef
      MAILGUN_DOMAIN: mg.example.com
      MAILGUN_WEBHOOK_SIGNING_KEY: key-ci-1234567890abcdef
      PAYMENT_PROVIDER: razorpay
      RAZORPAY_KEY_ID: rzp_test_ci_abcdef
      RAZORPAY_KEY_SECRET: secret-ci-1234567890abcdef
      RAZORPAY_WEBHOOK_SECRET: webhook-secret-ci-1234567890abcdef
      PAYMENT_WEBHOOK_SECRET: webhook-secret-ci-1234567890abcdef
      CORS_ORIGINS: https://dashboard.example.com
      ALLOW_MOCK_ADAPTERS: "false"
      WRITE_TOOLS_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Preflight must accept a valid prod-shaped config
        run: python -m scripts.preflight --env prod

  # ---- 4. pytest + policy-violation gate ----
  test:
    name: pytest + policy-violation gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./.ci_recovery.db
      # API_KEYS MUST match tests/conftest.py — otherwise every authenticated
      # request gets a 401. The keys themselves are placeholders; conftest
      # hard-pins them and the gitleaks allowlist regexes catch the literal
      # strings so this doesn't trigger secret scanning.
      API_KEYS: test-admin-key-1234567890ab:admin,test-run-key-1234567890ab:run,read,test-read-key-1234567890ab:read
      ENVIRONMENT: dev
      LLM_PROVIDER: mock
      PAYMENT_PROVIDER: console
      EMAIL_PROVIDER: console
      ALLOW_MOCK_ADAPTERS: "true"
      PAYMENT_WEBHOOK_SECRET: test-webhook-secret-1234567890ab
      RAZORPAY_WEBHOOK_SECRET: test-webhook-secret-1234567890ab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run full test suite
        run: python -m pytest tests/ -q
      - name: Policy violation rate must be exactly 0
        run: python scripts/check_policy_violations.py

  # ---- 5. alembic drift — models must match the migration chain ----
  migration-drift:
    name: alembic autogenerate diff must be empty
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recovery
          POSTGRES_PASSWORD: recovery
          POSTGRES_DB: recovery
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://recovery:recovery@localhost:5432/recovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt psycopg2-binary==2.9.10
      - run: alembic upgrade head
      - name: Autogenerate must produce an empty migration
        run: |
          # Stamp whatever the current head is; the script will be deleted
          # in the cleanup step so it never lands in the repo.
          alembic revision --autogenerate -m drift_check --rev-id drift_check_$$
          # Fail if any schema-changing op is present. Identical to the
          # pattern we use locally in the audit script.
          ! grep -qE "op\.(create|drop|add|remove|alter)" migrations/versions/*drift_check_*.py || {
            echo "::error::Models drifted from migrations — commit a new migration"
            echo "::group::Drifted migration contents"
            cat migrations/versions/*drift_check_*.py
            echo "::endgroup::"
            exit 1
          }
      - name: Clean up the generated drift-check file
        if: always()
        run: rm -f migrations/versions/*drift_check_*.py

  # ---- 6. frontend build + smoke tests ----
  frontend:
    name: frontend (build + smoke tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - run: npm ci
      - name: Frontend smoke tests (no DOM)
        run: node --test tests/
      # The next.config.ts fail-fasts if API_URL is missing in production,
      # so we provide a placeholder for the build step. The static
      # `next start` runtime must set this to the real public API URL.
      - name: Production build
        env:
          API_URL: https://api.example.com
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com
        run: npm run build

  # ---- 7. Docker build (production target only — fast) ----
  docker:
    name: docker build (api target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build the api target (catches Dockerfile regressions)
        run: docker build --target api --tag recovery-api:ci --load .
