# Full .env passthrough (R0): provider credentials (OPENROUTER_API_KEY,
# RAZORPAY_*, EMAIL_PROVIDER, ALLOW_MOCK_ADAPTERS, ...) reach every service.
# Missing .env is fine for a bare dev boot; explicit entries below win.
x-app-env: &appenv
  env_file:
    - path: .env
      required: false
  environment:
    # For local dev only: talk to the docker-compose Postgres. In production
    # (Render / Fly / k8s) override DATABASE_URL via the host's secret store
    # to point at the managed instance.
    DATABASE_URL: postgresql+psycopg2://recovery:recovery@db:5432/recovery
    # Multi-worker uvicorn — 2 workers per Render free plan.
    WEB_CONCURRENCY: "2"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-recovery}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-recovery}
      POSTGRES_DB: ${DB_NAME:-recovery}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Migrations run as an explicit one-shot step BEFORE api/worker start (P1-6).
  migrate:
    build:
      context: .
      target: migrate
    <<: *appenv
    depends_on:
      db:
        condition: service_healthy
    restart: "no"   # one-shot, never restart

  api:
    build:
      context: .
      target: api
    <<: *appenv
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    <<: *appenv
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # No port binding — the worker is a poller, not an HTTP service.

volumes:
  pgdata:
