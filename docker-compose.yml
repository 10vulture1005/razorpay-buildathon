# Full .env passthrough (R0): provider credentials (OPENROUTER_API_KEY,
# RAZORPAY_*, EMAIL_PROVIDER, ALLOW_MOCK_ADAPTERS, ...) reach every service.
# Missing .env is fine for a bare dev boot; explicit entries below win.
x-app-env: &appenv
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg2://recovery:recovery@db:5432/recovery

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: recovery
      POSTGRES_DB: recovery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Migrations run as an explicit one-shot step BEFORE api/worker start (P1-6).
  migrate:
    build: .
    command: ["python", "-m", "scripts.migrate", "upgrade", "head"]
    <<: *appenv
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    <<: *appenv
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["python", "-m", "app.workers.outcome_poller", "30"]
    <<: *appenv
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
